name: GlobeNews Build & Deploy

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'   # 北京时间 07:00 / 12:00 / 18:00
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: globenews-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch hot news (cloud, ~30-60 min)
        run: node scripts/fetch-hot-news.mjs
        timeout-minutes: 120

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4

      - name: Deploy to Netlify
        id: netlify
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -uo pipefail
          echo "NETLIFY_SITE_ID present: $([ -n "${NETLIFY_SITE_ID:-}" ] && echo yes || echo NO)"
          echo "NETLIFY_AUTH_TOKEN present: $([ -n "${NETLIFY_AUTH_TOKEN:-}" ] && echo yes || echo NO)"
          # 预检令牌是否仍然有效：直接打 Netlify API，避免又白等一整轮抓取才发现令牌失效。
          if ! curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/accounts >/dev/null; then
            echo "::error title=Netlify 令牌失效::NETLIFY_AUTH_TOKEN 无效、已失效或被吊销，本轮跳过 Netlify 部署。请在 Netlify 重建 PAT 并更新仓库 secret（见 SESSION-HANDOVER.md §2）。"
            exit 1
          fi
          echo "Netlify 令牌校验通过"
          npm install -g netlify-cli >/dev/null 2>&1 || { echo "::error title=Netlify CLI 安装失败::npm install -g netlify-cli 返回非零"; exit 1; }
          netlify deploy --dir public --functions functions --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "cloud fetch"

      # 关键：把 Netlify 步骤真实结果如实传递出来（不再被 continue-on-error 掩盖整轮状态）
      - name: Record Netlify outcome
        if: always()
        run: |
          echo "NETLIFY_OUTCOME=${{ steps.netlify.outcome }}" >> "$GITHUB_OUTPUT"
        id: netlify_outcome

      - name: Report Netlify outcome
        # 如实报告：Netlify 失败 -> 本步骤 exit 1 -> 整轮 run 报红（GitHub Pages 仍已成功发布）
        # 注意：仅打 ::error 注解【不会】让步骤失败，必须显式 exit 1。
        if: always() && steps.netlify.outcome != 'success'
        run: |
          OUTCOME="${{ steps.netlify.outcome }}"
          echo "::error title=Netlify 未部署::本轮 Netlify 部署失败（${OUTCOME}）。GitHub Pages 已正常发布最新站点，但对外主网址（Netlify）仍是旧版。"
          # 单引号 heredoc：避免反引号被 shell 当命令执行
          cat >> "$GITHUB_STEP_SUMMARY" <<'GN_SUMMARY'
          ### ❌ Netlify 未部署（整轮 run 已标记为失败）

          GitHub Pages 已发布最新站点；**Netlify 站点（对外主网址）仍是旧版**。

          排查顺序（详见 SESSION-HANDOVER.md §5 与 RECOVERY-CARD.md）：
          1. `NETLIFY_AUTH_TOKEN` 是否失效/被吊销 → 重建 PAT，用 `tools/update-netlify-token.mjs` 写回
          2. **Netlify 账户额度是否耗尽**（免费版 300 credits/月）→ 若报 `Account credit usage exceeded`，需等下期重置或充值
          3. 本地复现：`node tools/repro-netlify-deploy.mjs` 可拿到精确的拒绝原因

          > 临时替代：GitHub Pages 站点始终最新 → https://tranviethoangtb123-sudo.github.io/globenews/
          GN_SUMMARY
          # 明确失败，防止"坏了却全绿"
          exit 1

      - name: Netlify deploy confirmed
        if: always() && steps.netlify.outcome == 'success'
        run: |
          echo "✅ Netlify 部署成功，两个站点均为最新"
          cat >> "$GITHUB_STEP_SUMMARY" <<'GN_SUMMARY2'
          ### ✅ 两个站点均已发布最新版
          GN_SUMMARY2
