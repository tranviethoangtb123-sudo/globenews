name: GlobeNews Build & Deploy

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'   # 北京时间 07:00 / 12:00 / 18:00
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: globenews-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch hot news (cloud, ~30-60 min)
        run: node scripts/fetch-hot-news.mjs
        timeout-minutes: 120

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4

      - name: Deploy to Netlify
        id: netlify
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -uo pipefail
          echo "NETLIFY_SITE_ID present: $([ -n "${NETLIFY_SITE_ID:-}" ] && echo yes || echo NO)"
          echo "NETLIFY_AUTH_TOKEN present: $([ -n "${NETLIFY_AUTH_TOKEN:-}" ] && echo yes || echo NO)"
          # 预检令牌是否仍然有效：直接打 Netlify API，避免又白等一整轮抓取才发现令牌失效。
          if ! curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/accounts >/dev/null; then
            echo "::error title=Netlify 令牌失效::NETLIFY_AUTH_TOKEN 无效、已失效或被吊销，本轮跳过 Netlify 部署。请在 Netlify 重建 PAT 并更新仓库 secret（见 SESSION-HANDOVER.md §2）。"
            exit 1
          fi
          echo "Netlify 令牌校验通过"
          npm install -g netlify-cli >/dev/null 2>&1 || { echo "::warning title=Netlify CLI 安装失败::npm install -g netlify-cli 返回非零"; exit 1; }
          netlify deploy --dir public --functions functions --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "cloud fetch"

      - name: Report Netlify outcome
        if: always()
        env:
          NETLIFY_OUTCOME: ${{ steps.netlify.outcome }}
        run: |
          # Netlify 失败不应让整轮 run 报红——Pages 已成功发布最新站点。
          echo "Netlify step outcome: $NETLIFY_OUTCOME"
          if [ "$NETLIFY_OUTCOME" != "success" ]; then
            echo "::warning title=Netlify 未部署::本轮 Netlify 部署失败（${NETLIFY_OUTCOME}）。最新站点已通过 GitHub Pages 发布；Netlify 站点仍旧版。"
            {
              echo "### ⚠️ Netlify 未部署"
              echo ""
              echo "本轮 Netlify 步骤结果为 `$NETLIFY_OUTCOME`（GitHub Pages 已正常发布最新站点）。"
              echo "常见原因：`NETLIFY_AUTH_TOKEN` 失效/被吊销，或 `NETLIFY_SITE_ID` 缺失。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Netlify 部署成功"
          fi
