<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="环球新闻地球仪：全球 250 个国家与地区、上千座城市的今日新闻可视化。">
<title>环球新闻地球仪 · Globe News</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css?v=12">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://translate.googleapis.com">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="topbar-row">
      <div class="brand">WORLD NEWS</div>
      <div class="top-search-wrap" id="topSearchWrap">
        <input id="topSearch" type="search" autocomplete="off" placeholder="搜索全网新闻…">
        <div id="newsResults" class="hidden"></div>
      </div>
      <button id="langBtn" class="chip" title="切换新闻语言">EN</button>
    </div>
    <div class="seg" id="viewToggle">
      <button data-view="globe" class="on">地球仪</button>
      <button data-view="list">列表</button>
      <button data-view="sectors">板块</button>
      <button data-view="sources">来源</button>
    </div>
  </header>

  <div id="searchWrap">
    <input id="searchInput" type="search" autocomplete="off" placeholder="搜索国家 / 城市（如：东京、New York、北京…）">
    <div id="searchResults" class="hidden"></div>
  </div>

  <main>
    <div id="globeView">
      <div id="map"></div>
      <div id="mapHint">拖动旋转 · 双指缩放 · 点击国家或城市看新闻</div>
      <button id="projBtn" class="on" title="切换为 2D 平面地图">3D</button>
      <button id="homeBtn" title="回到全球视角">全景</button>
    </div>
    <div id="listView" class="hidden"></div>
    <div id="sectorsView" class="hidden">
      <div id="sectorTabs" class="sector-tabs"></div>
      <div id="sectorList" class="sector-list"></div>
    </div>
    <div id="sourcesView" class="hidden">
      <div id="srcRegion" class="src-region"></div>
      <div id="srcTabs" class="sector-tabs"></div>
      <div id="srcList" class="sector-list"></div>
    </div>
  </main>

  <div id="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div id="sheetHead">
      <div id="sheetTitle"></div>
      <span id="sheetBadge" class="hidden"></span>
      <div class="sheet-actions">
        <button id="sheetRefresh" title="刷新">刷新</button>
        <button id="sheetClose" title="关闭">关闭</button>
      </div>
    </div>
    <div id="sheetBody"></div>
  </div>

  <div id="toast"></div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="app.js?v=12"></script>
</body>
</html>
